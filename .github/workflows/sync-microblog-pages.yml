name: Sync Micro.blog pages

on:
  pull_request:
    paths:
      - 'migration/pages/about.md'
      - 'migration/pages/contact.md'
      - 'migration/pages/rules.md'
      - 'migration/pages/support.md'
      - 'migration/pages/manager-portal.md'
      - 'migration/pages/transfer-bans.md'
      - 'scripts/sync_microblog_pages.py'
      - 'scripts/transfer_bans_live.py'
      - '.github/workflows/sync-microblog-pages.yml'
  push:
    branches: [main]
    paths:
      - 'migration/pages/about.md'
      - 'migration/pages/contact.md'
      - 'migration/pages/rules.md'
      - 'migration/pages/support.md'
      - 'migration/pages/manager-portal.md'
      - 'migration/pages/transfer-bans.md'
      - 'scripts/sync_microblog_pages.py'
      - 'scripts/transfer_bans_live.py'
      - '.github/workflows/sync-microblog-pages.yml'
  workflow_dispatch:
  # Every day just after midnight UK time: rebuild the Transfer Bans page from the live register,
  # so bans that have ended, sales that have been made and new bans show without an edit.
  schedule:
    - cron: '37 0 * * *'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate managed page sources
        run: python scripts/sync_microblog_pages.py --all --dry-run

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: microblog-page-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish approved standalone pages
        env:
          MICROBLOG_TOKEN: ${{ secrets.MICROBLOG_TOKEN }}
        run: python scripts/sync_microblog_pages.py

  refresh-transfer-bans:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: microblog-page-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the Transfer Bans page from the live register
        env:
          MICROBLOG_TOKEN: ${{ secrets.MICROBLOG_TOKEN }}
        run: python scripts/sync_microblog_pages.py transfer-bans --require-live
